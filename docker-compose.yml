services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meetingrecorder-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetingrecorder-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Https__EnableRedirection: "false"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MeetingRecorderDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "docker-compose-key-change-me-in-prod-32chars-min!"
      Jwt__Issuer: "MeetingRecorder"
      Jwt__Audience: "MeetingRecorder.Client"
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  mssql-data:
  uploads:
